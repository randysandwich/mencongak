<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Flat Shape in Real World</title>
<style>
:root{
  --bg:#f4f1e8;--surface:#fffdf7;--ink:#303936;--muted:#8b918c;
  --teal:#3e918e;--yellow:#f2c94c;--yellow-dark:#d6aa2c;
  --green:#63ad82;--coral:#e98a73;
  --font:'Nunito','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);display:flex;justify-content:center;overflow:hidden}
button{font:inherit}
.frame{width:100%;max-width:620px;height:100dvh}
.board{
  width:100%;height:100%;padding:8px;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(circle at 8% 4%,rgba(67,143,139,.07),transparent 24%),
    radial-gradient(circle at 95% 12%,rgba(242,201,76,.09),transparent 25%),var(--bg);
}
.topbar{flex:0 0 auto;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:6px;margin:0 1px 4px}
.icon-btn{
  width:42px;height:42px;border:2px solid #d7d8d1;background:var(--surface);
  border-radius:14px;color:var(--ink);display:grid;place-items:center;
  font-size:1.15rem;font-weight:900;box-shadow:0 2px 0 rgba(58,65,61,.08);cursor:pointer
}
.brand{text-align:center;line-height:1.05}
.brand h1{margin:0;font-size:1.28rem;font-weight:900;letter-spacing:-.4px}
.brand .mini{margin-top:3px;color:var(--coral);font-size:.53rem;font-weight:900;letter-spacing:1.5px}
.mode-pill{
  flex:0 0 auto;width:max-content;margin:2px auto 6px;padding:6px 13px;background:var(--surface);
  border-radius:999px;color:var(--muted);font-size:.7rem;font-weight:800;
  box-shadow:0 2px 0 rgba(58,65,61,.05)
}
.mode-pill strong{color:var(--teal)}
.score-row{
  flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  margin:0 7px 4px;color:var(--muted);font-size:.68rem;font-weight:800
}
.score-row .count{color:var(--teal);font-size:.86rem;font-weight:900}
.progress-track{flex:0 0 auto;height:5px;margin:0 7px 7px;background:#e3e4dc;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--teal);border-radius:999px;transition:width .35s ease}
.quiz{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.problem-card{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface);border:2px solid #e2e1d8;border-radius:22px;padding:14px 12px 16px;margin:0 1px 7px;
  box-shadow:0 4px 0 rgba(58,65,61,.07),0 8px 20px rgba(58,65,61,.05);overflow:hidden;position:relative
}
.problem-card::before{
  content:"";position:absolute;width:70px;height:70px;border-radius:50%;
  background:rgba(67,143,139,.06);top:-28px;right:-18px
}
.question-text{
  position:relative;z-index:1;flex:0 0 auto;text-align:center;
  font-size:clamp(1.1rem,4.2vw,1.45rem);font-weight:900;margin:0 0 10px
}
.image-wrap{
  position:relative;z-index:1;width:min(88vw,440px);height:min(49vh,330px);min-height:170px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px
}
.shape-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:12px;user-select:none;-webkit-user-drag:none}
.choices{position:relative;z-index:2;width:min(96%,500px);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{
  min-height:52px;padding:8px 5px;border:2px solid #8fd7f4;border-radius:6px;background:#fff;color:#171717;
  font-weight:800;font-size:clamp(.8rem,3.1vw,1rem);cursor:pointer;transition:transform .1s ease,background .15s ease,border-color .15s ease
}
.choice:active{transform:translateY(2px)}
.choice.correct{background:#eef9f1;border-color:var(--green);color:#28704a}
.choice.wrong{background:#fff1ed;border-color:var(--coral);color:#a94f38}
.choice:disabled{cursor:default}
.feedback{flex:0 0 auto;min-height:26px;text-align:center;margin:0 5px 3px;font-size:.8rem;font-weight:900}
.feedback.benar{color:var(--green)}
.feedback.salah{color:var(--coral)}
.footer-note{flex:0 0 auto;text-align:center;color:#a1a59f;font-size:.56rem;font-weight:700;margin-top:3px}
.result-screen{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  background:var(--surface);border:2px solid #e2e1d8;border-radius:22px;padding:20px;box-shadow:0 4px 0 rgba(58,65,61,.07)
}
.big-score{color:var(--teal);font-size:3rem;font-weight:900;margin:7px 0 3px}
.result-screen p{color:var(--muted);margin:4px 0 18px;font-weight:700;font-size:.86rem}
#restartBtn{
  width:100%;min-height:46px;border:0;border-radius:15px;font-weight:900;background:var(--yellow);
  color:#5c4b18;box-shadow:0 4px 0 var(--yellow-dark);cursor:pointer
}
.hidden{display:none!important}
.shake{animation:shake .35s}.pop{animation:pop .35s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (max-width:430px){
  .board{padding:5px 7px}.topbar{grid-template-columns:38px 1fr 38px}
  .icon-btn{width:38px;height:38px;border-radius:12px}.brand h1{font-size:1.12rem}
  .mode-pill{font-size:.63rem;padding:5px 10px}.image-wrap{height:min(44vh,270px);min-height:150px;margin-bottom:9px}
  .choices{gap:7px}.choice{min-height:48px;font-size:.75rem}
}
@media (max-height:620px){
  .mode-pill{display:none}.image-wrap{height:min(40vh,220px);min-height:125px}
  .question-text{font-size:1rem;margin-bottom:6px}.choice{min-height:42px}.footer-note{display:none}
}
</style>
</head>

let questions = [], current = 0, score = 0, locked = false;

const qNumEl=document.getElementById('qNum');
const qTotalEl=document.getElementById('qTotal');
const scoreCountEl=document.getElementById('scoreCount');
const progressFill=document.getElementById('progressFill');
const shapeImage=document.getElementById('shapeImage');
const choicesEl=document.getElementById('choices');
const feedback=document.getElementById('feedback');
const problemCard=document.getElementById('problemCard');
const quizScreen=document.getElementById('quizScreen');
const resultScreen=document.getElementById('resultScreen');
const finalScore=document.getElementById('finalScore');
const finalMsg=document.getElementById('finalMsg');
const restartBtn=document.getElementById('restartBtn');

qTotalEl.textContent=TOTAL_QUESTIONS;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeChoices(answer){
  const others=shuffle(SHAPES.filter(s=>s!==answer)).slice(0,2);
  return shuffle([answer,...others]);
}

function generateQuestions(total){
  const result=[];
  for(let i=0;i<total;i++){
    const item=IMAGE_DATA[i%IMAGE_DATA.length];
    result.push({image:item.url,answer:item.answer,choices:makeChoices(item.answer)});
  }
  return shuffle(result);
}

function renderQuestion(){
  locked=false;
  const q=questions[current];
  qNumEl.textContent=current+1;
  progressFill.style.width=((current)/questions.length*100)+'%';
  shapeImage.src=q.image;
  shapeImage.alt='Real world object representing '+q.answer;
  choicesEl.innerHTML='';
  q.choices.forEach(choice=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.type='button';
    btn.textContent=choice;
    btn.addEventListener('click',()=>checkAnswer(choice,btn));
    choicesEl.appendChild(btn);
  });
  feedback.textContent='';
  feedback.className='feedback';
}

function checkAnswer(answer,button){
  if(locked)return;
  locked=true;
  const q=questions[current];
  const allButtons=[...document.querySelectorAll('.choice')];
  allButtons.forEach(b=>b.disabled=true);

  if(answer===q.answer){
    score++;
    scoreCountEl.textContent=score;
    button.classList.add('correct');
    feedback.textContent='✅ Correct! Great job!';
    feedback.className='feedback benar';
    problemCard.classList.add('pop');
    playCorrect();
  }else{
    button.classList.add('wrong');
    const correctBtn=allButtons.find(b=>b.textContent===q.answer);
    if(correctBtn)correctBtn.classList.add('correct');
    feedback.textContent='❌ Not quite. The answer is '+q.answer+'.';
    feedback.className='feedback salah';
    problemCard.classList.add('shake');
    playWrong();
  }

  setTimeout(()=>{
    problemCard.classList.remove('pop','shake');
    nextQuestion();
  },1200);
}

function nextQuestion(){
  current++;
  if(current>=questions.length)showResult();
  else renderQuestion();
}

function showResult(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  progressFill.style.width='100%';
  finalScore.textContent=score+' / '+questions.length;
  const pct=score/questions.length;
  if(pct===1)finalMsg.textContent='Perfect! You know your flat shapes! 🌟';
  else if(pct>=.8)finalMsg.textContent='Excellent! Keep it up! 🎈';
  else if(pct>=.5)finalMsg.textContent='Good work! Keep practicing! 💪';
  else finalMsg.textContent='Let’s try again. You can do it! 📚';
}

function restart(){
  questions=generateQuestions(TOTAL_QUESTIONS);
  current=0;score=0;scoreCountEl.textContent='0';
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
}

function showHelp(){
  alert('How to play:\\n\\n1. Look at the real-world picture.\\n2. Think about its flat shape.\\n3. Choose one of the 3 answers.');
}

let audioCtx=null;
function getCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freqStart,freqEnd,duration,type,volume){
  try{
    const ctx=getCtx();
    if(ctx.state==='suspended')ctx.resume();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freqStart,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd,ctx.currentTime+duration);
    gain.gain.setValueAtTime(volume,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+duration);
  }catch(e){}
}
function playCorrect(){
  playTone(880,1760,.18,'sine',.22);
  setTimeout(()=>playTone(1318,1318,.20,'sine',.18),90);
}

}

questions=generateQuestions(TOTAL_QUESTIONS);
