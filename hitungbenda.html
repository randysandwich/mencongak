<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Belajar Hitung Benda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f1e8;
  --surface:#fffdf7;
  --ink:#3f4743;
  --muted:#8b918c;
  --teal:#438f8b;
  --teal-dark:#2f706d;
  --yellow:#f2c94c;
  --yellow-dark:#d6aa2c;
  --coral:#e98a73;
  --green:#63ad82;
  --line:#dfe1d8;
  --font:'Nunito','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;width:100%;min-height:100%;
  background:var(--bg);
}

body{
  font-family:var(--font);
  color:var(--ink);
  display:flex;
  justify-content:center;
  padding:0;
  overflow:hidden;
}

button,input{font:inherit}

.frame{
  width:100%;
  max-width:520px;
  height:100dvh;
  min-height:0;
  margin:0 auto;
}

.board{
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 5%,rgba(67,143,139,.07),transparent 24%),
    radial-gradient(circle at 95% 12%,rgba(242,201,76,.09),transparent 25%),
    var(--bg);
  padding:
    max(5px,env(safe-area-inset-top))
    max(7px,env(safe-area-inset-right))
    max(6px,env(safe-area-inset-bottom))
    max(7px,env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
}

.topbar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:40px 1fr 40px;
  align-items:center;
  gap:6px;
  margin:0 1px 2px;
}

.icon-btn{
  width:40px;height:40px;
  border:2px solid #d7d8d1;
  background:var(--surface);
  border-radius:14px;
  color:var(--ink);
  display:grid;
  place-items:center;
  font-size:1.15rem;
  font-weight:900;
  box-shadow:0 2px 0 rgba(58,65,61,.08);
  cursor:pointer;
}

.brand{text-align:center;line-height:1.02}

.brand h1{
  margin:0;
  font-size:1.22rem;
  font-weight:900;
  letter-spacing:-.4px;
}

.brand .mini{
  margin-top:3px;
  color:var(--coral);
  font-size:.52rem;
  font-weight:900;
  letter-spacing:1.6px;
}

.mode-pill{
  flex:0 0 auto;
  width:max-content;
  margin:2px auto 5px;
  padding:5px 12px;
  background:var(--surface);
  border-radius:999px;
  color:var(--muted);
  font-size:.68rem;
  font-weight:800;
  box-shadow:0 2px 0 rgba(58,65,61,.05);
}

.mode-pill strong{color:var(--teal)}

.theme{
  flex:0 0 auto;
  text-align:center;
  margin:1px 0 3px;
  font-size:.61rem;
  font-weight:900;
  letter-spacing:1px;
  color:var(--muted);
  text-transform:uppercase;
}

.theme strong{color:var(--teal);font-size:.68rem}

#quizScreen{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.score-row{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 7px 3px;
  color:var(--muted);
  font-size:.67rem;
  font-weight:800;
}

.score-row .count{
  color:var(--teal);
  font-size:.85rem;
  font-weight:900;
}

.progress-track{
  flex:0 0 auto;
  height:5px;
  margin:0 7px 7px;
  background:#e3e4dc;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:var(--teal);
  border-radius:999px;
  transition:width .35s ease;
}

.problem-card{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:var(--surface);
  border:2px solid #e2e1d8;
  border-radius:22px;
  padding:12px 10px;
  margin:0 1px 7px;
  box-shadow:0 4px 0 rgba(58,65,61,.07),0 8px 20px rgba(58,65,61,.05);
  position:relative;
  overflow:hidden;
}

.problem-card::before{
  content:"";
  position:absolute;
  width:65px;height:65px;
  border-radius:50%;
  background:rgba(67,143,139,.06);
  top:-27px;right:-20px;
}

.question-label{
  position:relative;
  z-index:1;
  color:var(--muted);
  font-size:clamp(.75rem,3vw,.95rem);
  font-weight:900;
  margin-bottom:8px;
}

.object-area{
  position:relative;
  z-index:1;
  width:min(100%,390px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:clamp(5px,2vw,11px);
  align-items:center;
  justify-items:center;
  padding:8px 8px 12px;
}

.object{
  width:clamp(42px,11vw,62px);
  height:clamp(42px,11vw,62px);
  display:grid;
  place-items:center;
  font-size:clamp(1.65rem,7vw,2.5rem);
  line-height:1;
  user-select:none;
  filter:drop-shadow(0 2px 1px rgba(58,65,61,.10));
  animation:objectIn .18s ease both;
}

@keyframes objectIn{
  from{opacity:0;transform:scale(.72)}
  to{opacity:1;transform:scale(1)}
}

.count-question{
  position:relative;
  z-index:1;
  color:var(--ink);
  font-size:clamp(1.05rem,4.5vw,1.4rem);
  font-weight:900;
  margin:2px 0 9px;
}

.answer-input{
  position:relative;
  z-index:1;
  width:clamp(70px,20vw,86px);
  height:clamp(54px,16vw,68px);
  border:0;
  border-bottom:4px solid var(--yellow);
  border-radius:11px 11px 3px 3px;
  background:#fff9df;
  color:var(--teal);
  text-align:center;
  font-size:clamp(1.9rem,8vw,2.6rem);
  font-weight:900;
  outline:none;
  padding:0 3px;
}

.answer-input:focus{
  border-bottom-color:var(--teal);
  box-shadow:0 0 0 3px rgba(67,143,139,.10);
}

.answer-input::-webkit-outer-spin-button,
.answer-input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}

.answer-input[type=number]{-moz-appearance:textfield}

.feedback{
  flex:0 0 auto;
  min-height:25px;
  text-align:center;
  margin:0 5px 3px;
  font-size:.78rem;
  font-weight:900;
}

.feedback.benar{color:var(--green)}
.feedback.salah{color:var(--coral)}

.buttons{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:0 1px;
}

button.action{
  min-height:45px;
  border:0;
  border-radius:15px;
  font-weight:900;
  font-size:.85rem;
  cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;
}

button.action:active{transform:translateY(3px);box-shadow:none}
button.action:disabled{opacity:.55;cursor:default}

#checkBtn{
  background:var(--yellow);
  color:#5c4b18;
  box-shadow:0 4px 0 var(--yellow-dark);
}

#skipBtn{
  background:var(--surface);
  color:var(--muted);
  border:2px solid #dedfd7;
  box-shadow:0 2px 0 rgba(58,65,61,.08);
}

.footer-note{
  flex:0 0 auto;
  text-align:center;
  color:#a1a59f;
  font-size:.55rem;
  font-weight:700;
  margin-top:4px;
}

.result-screen{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:var(--surface);
  border:2px solid #e2e1d8;
  border-radius:22px;
  padding:20px;
  box-shadow:0 4px 0 rgba(58,65,61,.07);
}

.result-screen .big-score{
  color:var(--teal);
  font-size:3rem;
  font-weight:900;
  letter-spacing:-2px;
  margin:6px 0 2px;
}

.result-screen p{
  color:var(--muted);
  margin:4px 0 18px;
  font-weight:700;
  font-size:.85rem;
}

#restartBtn{
  width:100%;
  min-height:46px;
  border:0;
  border-radius:15px;
  font-weight:900;
  background:var(--yellow)!important;
  color:#5c4b18!important;
  box-shadow:0 4px 0 var(--yellow-dark)!important;
  cursor:pointer;
}

.hidden{display:none!important}

.shake{animation:shake .35s}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}
  40%,60%{transform:translateX(8px)}
}

.pop{animation:pop .35s}
@keyframes pop{
  0%{transform:scale(1)}
  40%{transform:scale(1.025)}
  100%{transform:scale(1)}
}

@media (max-height:620px){
  .topbar{grid-template-columns:34px 1fr 34px}
  .icon-btn{width:34px;height:34px;border-radius:11px;font-size:1rem}
  .brand h1{font-size:1rem}
  .brand .mini{font-size:.43rem;margin-top:2px}
  .mode-pill{font-size:.58rem;padding:3px 9px;margin-bottom:3px}
  .theme{font-size:.51rem;margin-bottom:2px}
  .theme strong{font-size:.56rem}
  .progress-track{margin-bottom:4px}
  .problem-card{margin-bottom:4px;border-radius:18px}
  .object-area{gap:3px;padding:4px 5px 7px}
  .object{font-size:1.6rem}
  .feedback{min-height:19px;font-size:.66rem}
  button.action{min-height:38px;font-size:.72rem;border-radius:12px}
  .footer-note{display:none}
}

@media (max-height:520px){
  .mode-pill,.theme{display:none}
  .problem-card{margin-top:2px}
  .question-label{margin-bottom:2px}
  .object-area{padding:2px 4px 4px}
  .object{font-size:1.45rem}
  .count-question{font-size:.95rem;margin:0 0 4px}
  .answer-input{height:48px;width:60px;font-size:1.7rem}
}

@media (min-width:521px){
  body{padding:0}
  .frame{max-width:520px}
}
</style>
</head>

<body>
<div class="frame">
<div class="board">

  <div class="topbar">
    <button class="icon-btn" type="button" aria-label="Kembali" onclick="history.back()">←</button>
    <div class="brand">
      <h1>Belajar Hitung</h1>
      <div class="mini">PLAY • LEARN • SMILE</div>
    </div>
    <button class="icon-btn" type="button" aria-label="Bantuan" id="helpBtn">?</button>
  </div>

  <div class="mode-pill">🍎 Latihan <strong>Hitung Benda</strong></div>

  <div class="theme">UNTUK TK • <strong>HITUNG 1–20</strong> • JUMLAH BENDA</div>

  <div id="quizScreen">
    <div class="score-row">
      <span>Soal <span id="qNum">1</span> / <span id="qTotal">100</span></span>
      <span>Skor <span class="count" id="scoreCount">0</span></span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="problem-card" id="problemCard">
      <div class="question-label">Hitung jumlah bendanya!</div>
      <div class="object-area" id="objectArea"></div>
      <div class="count-question">Ada berapa benda?</div>
      <input
        type="number"
        id="answerInput"
        class="answer-input"
        inputmode="numeric"
        min="1"
        max="20"
        autocomplete="off"
        aria-label="Jawaban"
      >
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="buttons">
      <button class="action" id="checkBtn">✓ Cek Jawaban</button>
      <button class="action" id="skipBtn">→ Lewati</button>
    </div>

    <div class="footer-note">Tekan Enter untuk memeriksa jawaban</div>
  </div>

  <div id="resultScreen" class="result-screen hidden">
    <div>🎉 Selesai!</div>
    <div class="big-score" id="finalScore">0 / 100</div>
    <p id="finalMsg">Kerja bagus!</p>
    <button id="restartBtn">↻ Main Lagi</button>
  </div>

</div>
</div>

<script>
// ======================================================
// HITUNG BENDA — JUMLAH 1–20
// ======================================================

const TOTAL_QUESTIONS = 100;

// Benda dibuat sebagai emoji supaya langsung berjalan tanpa asset tambahan.
const OBJECTS = [
  '🍎','⭐','🟡','🔵','🟢','🔴','🟣',
  '🌸','🍓','🐟','🦋','🎈','🍊','🍋'
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

const qNumEl = document.getElementById('qNum');
const qTotalEl = document.getElementById('qTotal');
const scoreCountEl = document.getElementById('scoreCount');
const progressFill = document.getElementById('progressFill');
const objectArea = document.getElementById('objectArea');
const answerInput = document.getElementById('answerInput');
const feedback = document.getElementById('feedback');
const problemCard = document.getElementById('problemCard');
const checkBtn = document.getElementById('checkBtn');
const skipBtn = document.getElementById('skipBtn');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const finalScore = document.getElementById('finalScore');
const finalMsg = document.getElementById('finalMsg');
const restartBtn = document.getElementById('restartBtn');

qTotalEl.textContent = TOTAL_QUESTIONS;

// ---------- Random ----------
function randomInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomObject(){
  return OBJECTS[randomInt(0, OBJECTS.length - 1)];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Buat 100 soal.
// Setiap soal mempunyai jumlah 1–20.
// Benda dan jumlah dibuat random.
function generateQuestions(total = TOTAL_QUESTIONS){
  const result = [];

  for(let i = 0; i < total; i++){
    result.push({
      count: randomInt(1, 20),
      object: randomObject()
    });
  }

  return result;
}

// ---------- Suara ----------
let audioCtx = null;

function getCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freqStart, freqEnd, duration, type, volume){
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
      freqEnd,
      ctx.currentTime + duration
    );

    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + duration);
  }catch(e){}
}

function playTing(){
  playTone(880,1760,.18,'sine',.25);
  setTimeout(() => playTone(1318,1318,.22,'sine',.20),90);
}

const wrongSound = new Audio('sound/faaah.mp3');
wrongSound.preload = 'auto';

function playTung(){
  try{
    wrongSound.currentTime = 0;
    const p = wrongSound.play();

    if(p !== undefined){
      p.catch(() => {
        playTone(220,110,.35,'sawtooth',.20);
      });
    }
  }catch(e){
    playTone(220,110,.35,'sawtooth',.20);
  }
}

// ---------- Render ----------
function renderObjects(count, emoji){
  objectArea.innerHTML = '';

  // Objek ditempatkan dalam grid 5 kolom.
  // Maksimum 20 = 4 baris × 5 kolom.
  for(let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.className = 'object';
    el.textContent = emoji;
    el.style.animationDelay = `${Math.min(i * 18, 260)}ms`;
    objectArea.appendChild(el);
  }
}

function renderQuestion(){
  const q = questions[current];

  answered = false;

  qNumEl.textContent = current + 1;
  progressFill.style.width =
    ((current) / questions.length * 100) + '%';

  renderObjects(q.count, q.object);

  answerInput.value = '';
  answerInput.disabled = false;

  feedback.textContent = '';
  feedback.className = 'feedback';

  checkBtn.disabled = false;
  skipBtn.disabled = false;

  setTimeout(() => answerInput.focus(), 40);
}

// ---------- Cek ----------
function checkAnswer(){
  if(answered) return;

  const val = answerInput.value.trim();

  if(val === ''){
    feedback.textContent = 'Isi dulu jawabannya ya!';
    feedback.className = 'feedback';
    answerInput.focus();
    return;
  }

  const userAnswer = parseInt(val, 10);
  const q = questions[current];

  answered = true;
  answerInput.disabled = true;
  checkBtn.disabled = true;
  skipBtn.disabled = true;

  if(userAnswer === q.count){
    score++;
    scoreCountEl.textContent = score;

    feedback.textContent = '✅ Benar! Ting~';
    feedback.className = 'feedback benar';

    problemCard.classList.remove('shake');
    problemCard.classList.add('pop');

    playTing();
  }else{
    feedback.textContent = `❌ Salah. Jawabannya ${q.count}. Tung...`;
    feedback.className = 'feedback salah';

    problemCard.classList.remove('pop');
    problemCard.classList.add('shake');

    playTung();
  }

  setTimeout(() => {
    problemCard.classList.remove('pop','shake');
    nextQuestion();
  }, 1100);
}

// ---------- Lewati ----------
function skipQuestion(){
  if(answered) return;

  const q = questions[current];

  answered = true;
  answerInput.disabled = true;
  checkBtn.disabled = true;
  skipBtn.disabled = true;

  feedback.textContent = `Jawabannya ${q.count}`;
  feedback.className = 'feedback';

  setTimeout(nextQuestion,700);
}

// ---------- Next ----------
function nextQuestion(){
  current++;

  if(current >= questions.length){
    showResult();
  }else{
    renderQuestion();
  }
}

// ---------- Result ----------
function showResult(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');

  progressFill.style.width = '100%';

  finalScore.textContent = `${score} / ${questions.length}`;

  const pct = score / questions.length;

  if(pct === 1){
    finalMsg.textContent =
      'Sempurna! Kamu jago menghitung! 🌟';
  }else if(pct >= .8){
    finalMsg.textContent =
      'Hebat sekali! Hampir sempurna! 🎈';
  }else if(pct >= .5){
    finalMsg.textContent =
      'Bagus, terus berlatih menghitung ya! 💪';
  }else{
    finalMsg.textContent =
      'Ayo coba lagi, pasti bisa lebih baik! 📚';
  }
}

// ---------- Restart ----------
function startGame(){
  questions = generateQuestions(TOTAL_QUESTIONS);
  current = 0;
  score = 0;
  answered = false;

  scoreCountEl.textContent = '0';

  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');

  renderQuestion();
}

// ---------- Events ----------
checkBtn.addEventListener('click', checkAnswer);
skipBtn.addEventListener('click', skipQuestion);

answerInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    checkAnswer();
  }
});

answerInput.addEventListener('input', () => {
  // Batasi jawaban pada 1–20.
  let value = answerInput.value;

  if(value.length > 2){
    answerInput.value = value.slice(0,2);
  }
});

restartBtn.addEventListener('click', startGame);

document.getElementById('helpBtn').addEventListener('click', () => {
  feedback.textContent = 'Hitung semua benda, lalu tulis jumlahnya 😊';
  feedback.className = 'feedback';
});

// Mulai permainan
startGame();
</script>

</body>
</html>
