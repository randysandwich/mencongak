<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Belajar Membaca • 2 Suku Kata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1e8;
    --surface:#fffdf7;
    --ink:#3f4743;
    --muted:#8b918c;
    --teal:#438f8b;
    --teal-dark:#2f706d;
    --yellow:#f2c94c;
    --yellow-dark:#d6aa2c;
    --coral:#e98a73;
    --line:#dfe1d8;
    --font:'Nunito','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
  }
  body{
    font-family:var(--font);
    color:var(--ink);
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  button{font:inherit}

  .frame{
    width:100%;
    max-width:520px;
    height:100dvh;
    margin:0 auto;
  }

  .board{
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 10% 5%, rgba(67,143,139,.07), transparent 24%),
      radial-gradient(circle at 95% 12%, rgba(242,201,76,.09), transparent 25%),
      var(--bg);
    padding:
      max(5px, env(safe-area-inset-top))
      max(7px, env(safe-area-inset-right))
      max(6px, env(safe-area-inset-bottom))
      max(7px, env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
  }

  .topbar{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:40px 1fr 40px;
    align-items:center;
    gap:6px;
    margin:0 1px 2px;
  }

  .icon-btn{
    width:40px;height:40px;
    border:2px solid #d7d8d1;
    background:var(--surface);
    border-radius:14px;
    color:var(--ink);
    display:grid;
    place-items:center;
    font-size:1.15rem;
    font-weight:900;
    box-shadow:0 2px 0 rgba(58,65,61,.08);
    cursor:pointer;
  }

  .brand{text-align:center;line-height:1.02}
  .brand h1{
    margin:0;
    font-size:1.22rem;
    font-weight:900;
    letter-spacing:-.4px;
  }
  .brand .mini{
    margin-top:3px;
    color:var(--coral);
    font-size:.52rem;
    font-weight:900;
    letter-spacing:1.6px;
  }

  .mode-pill{
    flex:0 0 auto;
    width:max-content;
    margin:2px auto 5px;
    padding:5px 12px;
    background:var(--surface);
    border-radius:999px;
    color:var(--muted);
    font-size:.68rem;
    font-weight:800;
    box-shadow:0 2px 0 rgba(58,65,61,.05);
  }
  .mode-pill strong{color:var(--teal)}

  .theme{
    flex:0 0 auto;
    text-align:center;
    margin:1px 0 3px;
    font-size:.61rem;
    font-weight:900;
    letter-spacing:1px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .theme strong{color:var(--teal);font-size:.68rem}

  #quizScreen{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  .score-row{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 7px 3px;
    color:var(--muted);
    font-size:.67rem;
    font-weight:800;
  }
  .score-row .count{
    color:var(--teal);
    font-size:.85rem;
    font-weight:900;
  }

  .progress-track{
    flex:0 0 auto;
    height:5px;
    margin:0 7px 7px;
    background:#e3e4dc;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0;
    background:var(--teal);
    border-radius:999px;
    transition:width .3s ease;
  }

  .problem-card{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface);
    border:2px solid #e2e1d8;
    border-radius:22px;
    padding:20px 10px;
    margin:0 1px 10px;
    box-shadow:0 4px 0 rgba(58,65,61,.07), 0 8px 20px rgba(58,65,61,.05);
    position:relative;
    overflow:hidden;
  }

  .problem-card::before{
    content:"";
    position:absolute;
    width:80px;height:80px;
    border-radius:50%;
    background:rgba(67,143,139,.06);
    top:-30px;right:-20px;
  }

  .syllables{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
  }

  .syllable-box strong{
    font-weight:900;
  }

.syllable-box{
    width:clamp(105px, 30vw, 145px);
    height:clamp(88px, 24vw, 115px);
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:2px solid #3f4743;
    color:#27302d;
    font-size:clamp(2.6rem, 11vw, 4rem);
    line-height:1;
    font-weight:500;
    letter-spacing:-2px;
  }

  .syllable-box:first-child{
    border-radius:12px 0 0 12px;
  }
  .syllable-box:last-child{
    border-radius:0 12px 12px 0;
  }

  .syllable-box.active{
    background:#fff9df;
  }

  .dash{
    font-size:clamp(1.6rem, 7vw, 2.4rem);
    font-weight:900;
    color:var(--muted);
    margin:0 8px;
  }

  .word-hint{
    position:absolute;
    left:0;
    right:0;
    bottom:15px;
    text-align:center;
    color:#b0b4af;
    font-size:.7rem;
    font-weight:800;
    letter-spacing:.8px;
  }

  .instruction{
    flex:0 0 auto;
    text-align:center;
    color:var(--muted);
    min-height:24px;
    margin:0 5px 5px;
    font-size:.75rem;
    font-weight:800;
  }

  .buttons{
    flex:0 0 auto;
    margin:0 1px;
  }

  button.next-btn{
    width:100%;
    min-height:52px;
    border:0;
    border-radius:16px;
    background:var(--yellow);
    color:#5c4b18;
    font-weight:900;
    font-size:.95rem;
    cursor:pointer;
    box-shadow:0 4px 0 var(--yellow-dark);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.next-btn:active{
    transform:translateY(3px);
    box-shadow:none;
  }

  .footer-note{
    flex:0 0 auto;
    text-align:center;
    color:#a1a59f;
    font-size:.55rem;
    font-weight:700;
    margin-top:5px;
  }

  .result-screen{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:var(--surface);
    border:2px solid #e2e1d8;
    border-radius:22px;
    padding:20px;
    box-shadow:0 4px 0 rgba(58,65,61,.07);
  }

  .result-screen .big{
    color:var(--teal);
    font-size:3rem;
    font-weight:900;
    letter-spacing:-2px;
    margin:8px 0 2px;
  }
  .result-screen p{
    color:var(--muted);
    margin:4px 0 18px;
    font-weight:700;
    font-size:.85rem;
  }
  #restartBtn{
    width:100%;
    min-height:46px;
    border:0;
    border-radius:15px;
    font-weight:900;
    background:var(--yellow);
    color:#5c4b18;
    box-shadow:0 4px 0 var(--yellow-dark);
    cursor:pointer;
  }

  .hidden{display:none!important}
  .pop{animation:pop .28s ease}
  @keyframes pop{
    0%{transform:scale(1)}
    45%{transform:scale(1.025)}
    100%{transform:scale(1)}
  }

  @media (max-height:620px){
    .topbar{grid-template-columns:34px 1fr 34px}
    .icon-btn{width:34px;height:34px;border-radius:11px;font-size:1rem}
    .brand h1{font-size:1rem}
    .brand .mini{font-size:.43rem;margin-top:2px}
    .mode-pill{font-size:.58rem;padding:3px 9px;margin-bottom:3px}
    .theme{font-size:.51rem;margin-bottom:2px}
    .theme strong{font-size:.56rem}
    .progress-track{margin-bottom:4px}
    .problem-card{margin-bottom:5px;border-radius:18px;padding:12px 8px}
    .syllable-box{height:70px;width:95px;font-size:2.35rem}
    .word-hint{bottom:8px;font-size:.6rem}
    .instruction{font-size:.65rem;min-height:18px}
    button.next-btn{min-height:43px;font-size:.78rem;border-radius:13px}
    .footer-note{display:none}
  }

  @media (max-height:520px){
    .mode-pill,.theme{display:none}
    .problem-card{margin-top:2px}
    .syllable-box{height:62px;width:85px;font-size:2rem}
    .dash{font-size:1.5rem;margin:0 5px}
  }

  @media (min-width:521px){
    body{padding:0}
    .frame{max-width:520px}
  }
</style>
</head>

</div>

let current = 0;

const qNumEl = document.getElementById('qNum');
const qTotalEl = document.getElementById('qTotal');
const progressTextEl = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const syllablesEl = document.getElementById('syllables');
const problemCard = document.getElementById('problemCard');
const instruction = document.getElementById('instruction');
const nextBtn = document.getElementById('nextBtn');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const finalCount = document.getElementById('finalCount');
const restartBtn = document.getElementById('restartBtn');

qTotalEl.textContent = questions.length;

function renderQuestion(){
  const q = questions[current];
  const pct = Math.round(((current + 1) / questions.length) * 100);

  qNumEl.textContent = current + 1;
  progressTextEl.textContent = pct + '%';
  progressFill.style.width = (((current + 1) / questions.length) * 100) + '%';

  syllablesEl.innerHTML = `
    <div class="syllable-box active">${capitalizeSyllable(q.parts[0])}</div>
    <div class="dash">-</div>
    <div class="syllable-box active">${capitalizeSyllable(q.parts[1])}</div>
  `;

  instruction.textContent = 'Baca dua suku kata dengan suara keras 😊';
  problemCard.classList.remove('pop');
  void problemCard.offsetWidth;
  problemCard.classList.add('pop');
}

function nextQuestion(){
  if(current >= questions.length - 1){
    showResult();
    return;
  }
  current++;
  renderQuestion();
}

function showResult(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  progressFill.style.width = '100%';
  progressTextEl.textContent = '100%';
  finalCount.textContent = `${questions.length} / ${questions.length}`;
}

function restart(){
  current = 0;
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
}

function capitalizeSyllable(value){
  const text = String(value).trim().toLowerCase();
  if(!text) return '';
  const first = text.charAt(0).toUpperCase();
  const rest = text.slice(1);
  return `<strong>${first}</strong>${rest}`;
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[ch]));
}

nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', restart);

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !resultScreen.classList.contains('hidden')){
    restart();
  } else if(e.key === 'Enter' && !nextBtn.disabled){
    nextQuestion();
  }
});

document.getElementById('backBtn').addEventListener('click', () => {
  if(current > 0){
    current--;
    renderQuestion();
  }
});

document.getElementById('helpBtn').addEventListener('click', () => {
  instruction.textContent = 'Contoh: Ba – ju dibaca “Ba-ju” 📖';
});
